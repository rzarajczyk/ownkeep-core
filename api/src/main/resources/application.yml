spring:
  application:
    name: ownkeep-core
  datasource:
    # Prefer a single OWNKEEP_DATABASE_URL (Neon postgres:// or JDBC).
    # DatabaseUrlEnvironmentPostProcessor extracts user/password when embedded.
    url: ${OWNKEEP_DATABASE_URL:jdbc:postgresql://localhost:5432/ownkeep}
    username: ${OWNKEEP_DATABASE_USER:ownkeep}
    password: ${OWNKEEP_DATABASE_PASSWORD:ownkeep}
    hikari:
      # Neon suspends after ~5 minutes with no sessions. Keep the pool empty when idle
      # (Cloud Run also freezes CPU between requests, so keepalives would never stop).
      minimum-idle: 0
      idle-timeout: 10000
      keepalive-time: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${OWNKEEP_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${OWNKEEP_MULTIPART_MAX_REQUEST_SIZE:101MB}
      file-size-threshold: 0
  jackson:
    default-property-inclusion: non_null

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    enabled: false

ownkeep:
  admin-email: ${OWNKEEP_ADMIN_EMAIL:}
  admin-password: ${OWNKEEP_ADMIN_PASSWORD:}
  token-ttl: ${OWNKEEP_TOKEN_TTL:30d}
  deleted-user-retention: ${OWNKEEP_DELETED_USER_RETENTION:60d}
  note-revision-retention: ${OWNKEEP_NOTE_REVISION_RETENTION:30d}
  max-sync-limit: ${OWNKEEP_MAX_SYNC_LIMIT:200}
  email-verification-required: ${OWNKEEP_EMAIL_VERIFICATION_REQUIRED:false}
  public-base-url: ${OWNKEEP_PUBLIC_BASE_URL:}
  email-verification-token-ttl: ${OWNKEEP_EMAIL_VERIFICATION_TOKEN_TTL:24h}
  email-verification-rate-limit:
    max-attempts-per-ip: ${OWNKEEP_EMAIL_VERIFY_MAX_ATTEMPTS_PER_IP:10}
    max-attempts-per-email: ${OWNKEEP_EMAIL_VERIFY_MAX_ATTEMPTS_PER_EMAIL:5}
    window: ${OWNKEEP_EMAIL_VERIFY_RATE_LIMIT_WINDOW:1m}
  login-rate-limit:
    max-attempts-per-ip: ${OWNKEEP_LOGIN_MAX_ATTEMPTS_PER_IP:10}
    max-attempts-per-email: ${OWNKEEP_LOGIN_MAX_ATTEMPTS_PER_EMAIL:${OWNKEEP_LOGIN_MAX_ATTEMPTS_PER_LOGIN:5}}
    window: ${OWNKEEP_LOGIN_RATE_LIMIT_WINDOW:1m}
  mail:
    host: ${OWNKEEP_MAIL_HOST:}
    port: ${OWNKEEP_MAIL_PORT:587}
    username: ${OWNKEEP_MAIL_USERNAME:}
    password: ${OWNKEEP_MAIL_PASSWORD:}
    smtp-auth: ${OWNKEEP_MAIL_SMTP_AUTH:true}
    start-tls: ${OWNKEEP_MAIL_STARTTLS:true}
    from: ${OWNKEEP_MAIL_FROM:}
  # Leave unset for local bootRun; Docker sets /app/static.
  # spa-static-dir: /app/static
  attachment:
    storage: ${OWNKEEP_ATTACHMENT_STORAGE:filesystem}
    storage-root: ${OWNKEEP_ATTACHMENT_STORAGE_ROOT:./data/attachments}
    max-file-size: ${OWNKEEP_ATTACHMENT_MAX_FILE_SIZE:26214400}
    per-user-quota: ${OWNKEEP_ATTACHMENT_PER_USER_QUOTA:1073741824}
    gcs:
      bucket: ${OWNKEEP_ATTACHMENT_GCS_BUCKET:}
      prefix: ${OWNKEEP_ATTACHMENT_GCS_PREFIX:}
  takeout-import:
    max-upload-size: ${OWNKEEP_IMPORT_MAX_UPLOAD_SIZE:104857600}
    max-entries: ${OWNKEEP_IMPORT_MAX_ENTRIES:5000}
    max-entry-size: ${OWNKEEP_IMPORT_MAX_ENTRY_SIZE:52428800}
    max-uncompressed-size: ${OWNKEEP_IMPORT_MAX_UNCOMPRESSED_SIZE:524288000}
    max-warnings: ${OWNKEEP_IMPORT_MAX_WARNINGS:100}
