# OwnKeep Core — self-hosted notes app (Elastic-2.0).
#
# Quick start:
#   curl -fsSLO https://raw.githubusercontent.com/rzarajczyk/ownkeep-core/main/docker-compose.yaml
#   curl -fsSLO https://raw.githubusercontent.com/rzarajczyk/ownkeep-core/main/.env.example
#   cp .env.example .env   # replace every CHANGE_ME; keep DB host as "db"
#   docker compose up -d

name: ownkeep-core

configs:
  postgres_entrypoint:
    content: |
      #!/bin/sh
      # Derive POSTGRES_* for the official Postgres image from OWNKEEP_DATABASE_URL.
      set -eu
      url="$${OWNKEEP_DATABASE_URL:-}"
      if [ -z "$$url" ]; then
        echo "OWNKEEP_DATABASE_URL is required" >&2
        exit 1
      fi
      case "$$url" in
        jdbc:*) url="$${url#jdbc:}" ;;
      esac
      case "$$url" in
        postgres://*|postgresql://*) ;;
        *)
          echo "OWNKEEP_DATABASE_URL must be a postgres://, postgresql://, or jdbc:postgresql:// URL" >&2
          exit 1
          ;;
      esac
      rest="$${url#*://}"
      userinfo="$${rest%%@*}"
      hostpath="$${rest#*@}"
      if [ "$$userinfo" = "$$rest" ]; then
        echo "OWNKEEP_DATABASE_URL must include user:password@" >&2
        exit 1
      fi
      user="$${userinfo%%:*}"
      pass="$${userinfo#*:}"
      if [ "$$user" = "$$userinfo" ] || [ -z "$$pass" ]; then
        echo "OWNKEEP_DATABASE_URL must include user:password@" >&2
        exit 1
      fi
      pathquery="$${hostpath#*/}"
      db="$${pathquery%%\?*}"
      db="$${db:-ownkeep}"
      decode() {
        printf '%b' "$$(printf '%s' "$$1" | sed -e 's/+/ /g' -e 's/%\([0-9A-Fa-f][0-9A-Fa-f]\)/\\x\1/g')"
      }
      export POSTGRES_USER="$$(decode "$$user")"
      export POSTGRES_PASSWORD="$$(decode "$$pass")"
      export POSTGRES_DB="$$db"
      exec docker-entrypoint.sh postgres

services:
  app:
    image: docker.io/rzarajczyk/ownkeep-core:${OWNKEEP_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "${OWNKEEP_PORT:-8080}:8080"
    environment:
      OWNKEEP_DATABASE_URL: "${OWNKEEP_DATABASE_URL:?Set OWNKEEP_DATABASE_URL in .env}"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "${OWNKEEP_ATTACHMENT_MAX_FILE_SIZE:-26214400}B"
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "${OWNKEEP_MULTIPART_MAX_REQUEST_SIZE:-27262976}B"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      OWNKEEP_ADMIN_EMAIL: "${OWNKEEP_ADMIN_EMAIL:?Set OWNKEEP_ADMIN_EMAIL in .env}"
      OWNKEEP_ADMIN_PASSWORD: "${OWNKEEP_ADMIN_PASSWORD:?Set OWNKEEP_ADMIN_PASSWORD in .env}"
      OWNKEEP_TOKEN_TTL: "${OWNKEEP_TOKEN_TTL:-PT24H}"
      OWNKEEP_EMAIL_VERIFICATION_REQUIRED: "${OWNKEEP_EMAIL_VERIFICATION_REQUIRED:-false}"
      OWNKEEP_PUBLIC_BASE_URL: "${OWNKEEP_PUBLIC_BASE_URL:-}"
      OWNKEEP_MAIL_HOST: "${OWNKEEP_MAIL_HOST:-}"
      OWNKEEP_MAIL_PORT: "${OWNKEEP_MAIL_PORT:-587}"
      OWNKEEP_MAIL_USERNAME: "${OWNKEEP_MAIL_USERNAME:-}"
      OWNKEEP_MAIL_PASSWORD: "${OWNKEEP_MAIL_PASSWORD:-}"
      OWNKEEP_MAIL_SMTP_AUTH: "${OWNKEEP_MAIL_SMTP_AUTH:-true}"
      OWNKEEP_MAIL_STARTTLS: "${OWNKEEP_MAIL_STARTTLS:-true}"
      OWNKEEP_MAIL_FROM: "${OWNKEEP_MAIL_FROM:-}"
      OWNKEEP_ATTACHMENT_STORAGE_ROOT: /data/attachments
      OWNKEEP_ATTACHMENT_MAX_FILE_SIZE: "${OWNKEEP_ATTACHMENT_MAX_FILE_SIZE:-26214400}"
      OWNKEEP_ATTACHMENT_PER_USER_QUOTA: "${OWNKEEP_ATTACHMENT_PER_USER_QUOTA:-1073741824}"
      OWNKEEP_SPA_STATIC_DIR: /app/static
      LOADER_PATH: /app/extensions
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      OWNKEEP_DATABASE_URL: "${OWNKEEP_DATABASE_URL:?Set OWNKEEP_DATABASE_URL in .env}"
    configs:
      - source: postgres_entrypoint
        target: /postgres-entrypoint.sh
        mode: 0555
    entrypoint: ["/bin/sh", "/postgres-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres:/var/lib/postgresql
    stop_grace_period: 1m
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres:
    name: ownkeep-postgres
  attachments:
    name: ownkeep-attachments
